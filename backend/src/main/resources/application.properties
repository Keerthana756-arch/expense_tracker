spring.application.name=expense-tracker-backend

# Render dynamically assigns PORT via environment variable (defaults to 8080 locally)
server.port=${PORT:8080}

# Persistent H2 file database (uses DATA_DIR or defaults to ./data)
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/expensedb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console for diagnostics
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
